# configs/baseline_b3.yaml — P4-T1/T2/T4 baseline retrain on clean FF++ splits
# Training keys match IMPLEMENTATION.md §P4-T1. Architecture = legacy capstone, UNCHANGED, so this
# run isolates the protocol fix from any architecture change.

backbone: efficientnet_b3
pretrained: true
img_size: 300                 # B3 native; P4-T2 also runs 224 for the comparison
head_hidden: 512              # legacy SpatialHead (src/ground_truth/models.py)
dropout: 0.4
temporal:                     # legacy TemporalModel: Bi-LSTM + AttentionPool
  hidden_dim: 512
  n_layers: 2
  bidirectional: true
  dropout: 0.3
frames_per_video: 32

dataset: ffpp_c23             # invariant 1
batch_size: 24
amp: true                     # enabled by the P1-T3 fix
epochs: 30
optimizer: adamw
lr: 1.0e-4
weight_decay: 1.0e-2
scheduler: cosine
warmup_epochs: 2
label_smoothing: 0.05
early_stop_patience: 7        # on FF++ val only — invariant 2
seeds: [42, 1337, 2024]       # invariant 6

evaluation:
  threshold_source: ffpp_val  # NEVER from a test set — invariant 2
  metrics: [auc, ap, eer, acc]
  bootstrap_over: videos      # NEVER frames — invariant 8
  bootstrap_n: 1000           # bootstrap_auc default, IMPLEMENTATION.md §P4
