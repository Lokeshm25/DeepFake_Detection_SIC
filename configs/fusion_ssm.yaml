# configs/fusion_ssm.yaml — P5-T3/T4 reliability-conditioned selective fusion + P6-T4 ablations
# STUB — values finalised during Phase 5. Spec: IMPLEMENTATION.md §P5-T3, §P5-T4, §P6-T4.
# Backbone settings live in configs/backbone_clip.yaml, the estimator in configs/reliability.yaml.

# Gate 0-A result — written by P0-T1. The ONLY key that branches on the sm_120 build outcome.
operator: mamba_cuda                # mamba_cuda | mamba_torch | film_attn

backbone_config: configs/backbone_clip.yaml
reliability_config: configs/reliability.yaml

# Token construction (P5-T3)
tokens:
  streams: [spatial, frequency, temporal]   # order inside each timestep: [s_t, f_t, m_t]
  frequency_encoder: dct_cnn       # DCT/FFT magnitude map -> small CNN -> R^D
  temporal_encoder: frame_diff     # frame difference (or optical flow) features -> R^D
  token_dim: 256
  sequence_length: 96              # 32 frames x 3 streams, interleaved
  stream_type_embedding: true      # learned 3-way embedding
  temporal_position_embedding: true

# Conditioning — the paper's core mechanism. Which gate is active is set by ablation.gate below.
conditioning:
  rel_dim: 4                       # r_t in R^4 per FRAME, shared by its 3 tokens (reliability.yaml)
  w_rel: per_stream                # one W_rel (and FiLM gamma) per stream — decided 2026-11-21
  w_rel_init: zero                 # invariant 7
  film_gamma_init: zero            # invariant 7 — gamma_B, gamma_C (and gamma_k/v for film_attn)
  conf_scale_init: zero            # invariant 7

# SSM parameters
ssm:
  d_model: 256
  d_state: 16
  d_conv: 4
  expand: 2

# Calibration (P5-T4)
calibration:
  lambda_sweep: [0.0, 0.05, 0.1, 0.2]
  metric: ece                      # gate: ECE improves under shift with no AUC regression

# SBI (P5-T4) — set by ablation.sbi below

# Ablation surface (P6-T4) — every ablation is a switch here, never a separate model file
ablation:
  gate: conditioned                # none | static | conditioned | oracle
  operator: null                   # null = use top-level `operator`; set `transformer` only for
                                   # the SSM-vs-Transformer row
  tokens: interleaved              # interleaved | separate
  backbone: adapted                # frozen | adapted
  sbi: stream_specific             # shared | stream_specific
  reliability: learned             # learned | true_crf

# Training
training:
  dataset: ffpp_c23                # invariant 1
  epochs: 30
  batch_size: 16                   # 12GB VRAM budget
  gradient_accumulation: 2         # prefer this over fewer frames (CLAUDE.md)
  optimizer: adamw
  lr: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 3
  amp: true                        # enabled by the P1-T3 mask fix
  seeds: [42, 1337, 2024]          # invariant 6
