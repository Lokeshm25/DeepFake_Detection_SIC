# configs/preprocess.yaml — P3-T3 preprocessing pipeline
# Keys below `detector` match IMPLEMENTATION.md §P3-T3 exactly. Finalised during Phase 3.

detector: null                # REQUIRED — set from the P3-T1 result. Deliberately unset:
                              # preprocess.py must raise if this is null. Shipping a default
                              # here would let an agent skip the bake-off by accepting it.
frames_per_video: 32          # research requirement, not a tunable (CLAUDE.md)
sampling: uniform             # uniform over full duration
crop_size: 320                # stored size; models resize (B3 at 300/224, CLIP at 224)
crop_margin: 1.3              # multiplier on max(box_w, box_h) -> square crop
output_format: png
png_compress_level: 3         # 0-9; 3 balances size and write speed
min_face_size: 64             # skip detections smaller than this (px)
max_workers: 12               # 24-core CPU; leave headroom for the GPU feed
on_missing_face: nearest      # nearest | skip | black

# Paths — relative to repo root, forward slashes (CLAUDE.md conventions)
raw_root: data/raw/
crops_root: data/crops/
splits_dir: data/splits/

# Dataset roles — fixed by CLAUDE.md invariant 1. verify_splits reads these.
datasets:
  ffpp_c23:
    role: train                    # the ONLY training dataset
    path: data/raw/FaceForensics/c23/
    methods: [Deepfakes, Face2Face, FaceSwap, NeuralTextures]
  ffpp_c40:
    role: eval
    path: data/raw/FaceForensics/c40/
  cdf2:
    role: eval                     # NEVER train
    path: data/raw/CelebDF-v2/
  dfdc:
    role: eval
    path: data/raw/DFDC/
  dfdcp:
    role: eval
    path: data/raw/DFDCP/
  dfd:
    role: eval
    path: data/raw/DFD/
