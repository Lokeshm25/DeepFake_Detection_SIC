[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detection-sic"
version = "0.1.0"
description = "Reliability-Conditioned Selective Fusion for Generalizable Deepfake Detection"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Lokesh Maheshwari"},
]

dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",          # Spearman gate in P5-T2
    # Face-detector packages are installed during P3-T1 (bake-off); none is pinned until it picks one.
    "opencv-python>=4.9",
    "Pillow>=10.2",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "facenet-pytorch>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
deploy = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "onnxruntime-gpu>=1.18",
]
demo = [
    "streamlit>=1.36",
]
research = [
    "wandb>=0.17",
    "torchinfo>=1.8",
    "fvcore>=0.1",        # FlopCountAnalysis for P6-T5
]

[project.scripts]
# Evaluation commands matching IMPLEMENTATION.md
# e.g.: python -m src.eval.evaluate --config configs/eval_matrix.yaml
# These are registered as convenience entry points

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that train models or run full inference",
    "gpu: marks tests that require a CUDA GPU",
    "leakage: marks split-integrity and leakage detection tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual typing — tighten later
ignore_missing_imports = true
